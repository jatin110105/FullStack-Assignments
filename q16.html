<!DOCTYPE html>
<html>
<head>
    <title></title>
</head>
<body>
    <h1>URI Encoding Example</h1>
    <p>Unencoded link (contains spaces and special characters):</p>
    <p>https://example.com/search?query=HTML & CSS</p>
    <p>Correctly encoded link:</p>
    <a href="https://example.com/search?query=HTML%20%26%20CSS">https://example.com/search?query=HTML%20%26%20CSS</a>
</body>
</html>

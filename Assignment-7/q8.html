<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Box Model</title>
<link rel="stylesheet" href="q8.css">
</head>
<body>
<main class="wrapper">
  <div class="margin-layer">
    Margin
    <div class="border-layer">
      Border
      <div class="padding-layer">
        Padding
        <div class="content-layer">Content</div>
      </div>
    </div>
  </div>
</main>
<section class="explain">
  <p><strong>Content:</strong> the actual text/element.</p>
  <p><strong>Padding:</strong> space between content and border.</p>
  <p><strong>Border:</strong> the edge around padding.</p>
  <p><strong>Margin:</strong> space outside the border, separating from other elements.</p>
</section>
</body>
</html>

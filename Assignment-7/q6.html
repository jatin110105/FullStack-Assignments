<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSS Transformations</title>
<link rel="stylesheet" href="q6.css">
</head>
<body>
<header><h1>Transformations Showcase</h1></header>
<main class="transform-row">
  <div class="box-wrap">
    <div class="box rotate-box">Rotate</div>
    <p>rotate()</p>
  </div>
  <div class="box-wrap">
    <div class="box scale-box">Scale</div>
    <p>scale()</p>
  </div>
  <div class="box-wrap">
    <div class="box translate-box">Move</div>
    <p>translate()</p>
  </div>
  <div class="box-wrap">
    <div class="box skew-box">Skew</div>
    <p>skew()</p>
  </div>
</main>
</body>
</html>

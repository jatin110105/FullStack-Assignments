<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Combined Layout</title>
<link rel="stylesheet" href="q10.css">
</head>
<body>
  <header class="site-header">
    <div class="logo">MyLogo</div>
    <nav class="nav-links">
      <a href="#">Home</a>
      <a href="#">Blog</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main class="content-grid">
    <article class="article">
      <h1 class="fade-title">Featured Article</h1>
      <div class="article-boxes">
        <div class="box">Intro</div>
        <div class="box">Body</div>
        <div class="box">Conclusion</div>
      </div>
    </article>
    <aside class="sidebar">
      <h3>Related Links</h3>
      <ul>
        <li>Link One</li>
        <li>Link Two</li>
      </ul>
    </aside>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Combined Layout Demo</p>
  </footer>
</body>
</html>

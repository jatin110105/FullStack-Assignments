<!DOCTYPE html>
<html>
<head>
    <title></title>
</head>
<body>
    <h1>Contact Us</h1>
    <form method="post" action="#">
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>
        <label for="subject">Subject:</label>
        <input type="text" id="subject" name="subject" placeholder="Enter subject" required><br><br>
        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="5" cols="40" placeholder="Type your message" required></textarea><br><br>
        <input type="submit" value="Send Message">
    </form>
</body>
</html>

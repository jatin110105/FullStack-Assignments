<!DOCTYPE html>
<html>
<head>
    <title></title>
</head>
<body>
    <h1>Secure Login Form</h1>
    <form method="post" action="#" autocomplete="off">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required><br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>
        <input type="submit" value="Login">
    </form>
    <p>Turning off autocomplete prevents browsers from storing and auto-filling sensitive data like passwords, reducing the risk of unauthorized access on shared or public computers.</p>
</body>
</html>
